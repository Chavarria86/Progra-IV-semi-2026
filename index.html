<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Biblioteca</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            border-bottom: 3px solid #0d6efd;
        }

        .card {
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }

        .card-header {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }

        footer {
            background-color: #212529;
            color: white;
            padding: 15px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div id="app">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Sistema de Biblioteca</a>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link"
                       :class="{ active: forms.autores.mostrar }"
                       href="#"
                       @click="abrirVentana('autores')">
                        Autores
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       :class="{ active: forms.libros.mostrar }"
                       href="#"
                       @click="abrirVentana('libros')">
                        Libros
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container mt-4">

        <!-- AUTORES -->
        <autores
            ref="autores"
            :forms="forms"
            v-show="forms.autores.mostrar"
            @buscar='buscar("busqueda_autores", "obtenerAutores")'>
        </autores>

        <busqueda_autores
            ref="busqueda_autores"
            v-show="forms.busqueda_autores.mostrar"
            @modificar='modificar("autores", "modificarAutor", $event)'>
        </busqueda_autores>

        <!-- LIBROS -->
        <libros
            ref="libros"
            :forms="forms"
            v-show="forms.libros.mostrar"
            @buscar='buscar("busqueda_libros", "obtenerLibros")'>
        </libros>

        <busqueda_libros
            ref="busqueda_libros"
            v-show="forms.busqueda_libros.mostrar"
            @modificar='modificar("libros", "modificarLibro", $event)'>
        </busqueda_libros>

    </div>

    <!-- FOOTER -->
    <footer>
        Sistema de Biblioteca © 2026 <br>
        Ingeniería en Sistemas
    </footer>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/dexie/dist/dexie.js"></script>

<script src="autores.js"></script>
<script src="busqueda_autores.js"></script>
<script src="libros.js"></script>
<script src="busqueda_libros.js"></script>
<script src="Main.js"></script>

</body>
</html>
